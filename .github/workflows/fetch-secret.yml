name: Fetch Azure Key Vault Secret

on:
  push:
    branches:
      - main  # Adjust the branch name as per your workflow trigger

jobs:
  fetch-secret:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout your code (if you need it)
    - name: Checkout code
      uses: actions/checkout@v2

    # Step 2: Log in to Azure using Service Principal
    - name: Log in to Azure using Service Principal
      run: |
        az login --service-principal --username ${{ secrets.AZURE_CLIENT_ID }} --password ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}

    # Step 3: Fetch the secret from Azure Key Vault
    - name: Fetch Secret from Azure Key Vault
      id: fetch_secret
      run: |
        SECRET=$(az keyvault secret show --name viswa --vault-name viswakv --query value -o tsv)
        echo "Secret fetched: $SECRET"
        echo "::set-output name=secret::$SECRET"

    # Step 4: Use the secret in subsequent steps
    - name: Use the Secret
      run: |
        echo "The fetched secret is: ${{ steps.fetch_secret.outputs.secret }}"
